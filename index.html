<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Termbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap">
<style>
/* Layout: one centered column. The five Leitner boxes are the deck's spine; the flashcard is the only raised object. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#E4E8F1; --line:#D3D9E5;
  --ink:#121A2C; --muted:#586379;
  --accent:#3040D8; --accent-ink:#FFFFFF; --accent-soft:#E2E6FC;
  --good:#16784A; --on-good:#FFFFFF; --good-soft:#DAF0E5;
  --bad:#B3361F; --on-bad:#FFFFFF; --bad-soft:#F8DDD6;
  --b0:#D3D9E5; --b1:#C6CCF5; --b2:#A1AAEF; --b3:#7B87E6; --b4:#5462DE; --b5:#3040D8;
  --shadow:0 1px 1px rgba(18,26,44,.05),0 18px 36px -18px rgba(18,26,44,.35);
  --scrim:rgba(10,14,26,.5);
  --f-serif:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1120; --surface:#171B2E; --surface-2:#20253B; --line:#2C3350;
    --ink:#E9ECF6; --muted:#9BA4BC;
    --accent:#8E9AFF; --accent-ink:#0E1120; --accent-soft:#222956;
    --good:#4FCB8E; --on-good:#06210F; --good-soft:#12301F;
    --bad:#FF8573; --on-bad:#2C0B06; --bad-soft:#3A1A16;
    --b0:#2C3350; --b1:#2F3868; --b2:#434F9C; --b3:#6071D8; --b4:#7E8CF4; --b5:#A3ADFF;
    --shadow:0 1px 1px rgba(0,0,0,.3),0 18px 36px -18px rgba(0,0,0,.7);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2E; --surface-2:#20253B; --line:#2C3350;
  --ink:#E9ECF6; --muted:#9BA4BC;
  --accent:#8E9AFF; --accent-ink:#0E1120; --accent-soft:#222956;
  --good:#4FCB8E; --on-good:#06210F; --good-soft:#12301F;
  --bad:#FF8573; --on-bad:#2C0B06; --bad-soft:#3A1A16;
  --b0:#2C3350; --b1:#2F3868; --b2:#434F9C; --b3:#6071D8; --b4:#7E8CF4; --b5:#A3ADFF;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 18px 36px -18px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-ui);
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:920px;margin-inline:auto}
h1{font:600 clamp(28px,4.4vw,38px)/1.12 var(--f-serif);letter-spacing:-.015em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h2{font:600 22px/1.25 var(--f-serif);margin:0;text-wrap:balance}
p{margin:0}
code{font:500 .9em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:14px}
.lede{color:var(--muted);max-width:60ch;margin-top:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:inline-flex;align-items:flex-end;gap:2px;height:20px}
.logo i{display:block;width:4px;border-radius:1px}
.logo i:nth-child(1){height:6px;background:var(--b1)}
.logo i:nth-child(2){height:10px;background:var(--b2)}
.logo i:nth-child(3){height:13px;background:var(--b3)}
.logo i:nth-child(4){height:17px;background:var(--b4)}
.logo i:nth-child(5){height:20px;background:var(--b5)}
.wm{font:700 20px/1 var(--f-serif);letter-spacing:-.01em}
.hright{display:flex;align-items:center;gap:14px}
.status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.status[data-s="saving"]::before{background:var(--b3)}
.status[data-s="error"]::before{background:var(--bad)}
@media (max-width:520px){.status{display:none}}

/* buttons */
.btn{
  appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:600 16px/1 var(--f-ui);min-height:48px;padding:0 20px;border-radius:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center;
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 12px}
.btn.big{min-height:60px;font-size:18px}
.btn.good{background:var(--good);border-color:var(--good);color:var(--on-good)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger.armed{background:var(--bad);color:var(--on-bad)}

/* library */
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:22px}
.tile{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;min-width:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;font:inherit}
.tile:active{background:var(--surface-2)}
.tile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tile-name{font:600 21px/1.2 var(--f-serif);overflow-wrap:anywhere;min-width:0}
.tile-meta{color:var(--muted);font-size:14px}
.bar{display:flex;gap:2px;height:10px}
.bar:empty{background:var(--b0);border-radius:99px}
.bar i{display:block;border-radius:2px}
.chip{align-self:flex-start;font:600 13px/1 var(--f-ui);padding:7px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.quiet{background:var(--surface-2);color:var(--muted)}
.tag{flex:none;font:600 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.howto{margin-top:28px;color:var(--muted);font-size:14px;max-width:62ch}
.sk{min-height:130px;background:var(--surface-2);border-color:transparent;cursor:default}
@media (prefers-reduced-motion:no-preference){.sk{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}}

/* deck */
.dtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.banner{margin-top:16px;background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{max-width:52ch;min-width:0}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:20px}
.bx{background:var(--surface);padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bx .sw{height:6px;border-radius:3px;margin-bottom:8px}
.bx .n{font:600 26px/1 var(--f-serif);font-variant-numeric:tabular-nums}
.bx .l{font-size:13px;font-weight:600;margin-top:4px}
.bx .i{font-size:12px;color:var(--muted)}
@media (max-width:560px){.boxes{grid-template-columns:repeat(3,1fr)}}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.actions .btn{flex:1 1 180px}
.dir{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 15px/1 var(--f-ui);padding:0 16px;min-height:44px;border-radius:10px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sec{margin-top:34px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.addform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
@media (max-width:720px){.addform{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:600 13px/1.2 var(--f-ui);letter-spacing:.04em;color:var(--muted)}
.opt-note{font-weight:500}
input,textarea,select{
  font:16px/1.4 var(--f-ui);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px;min-height:48px;width:100%;min-width:0;-webkit-appearance:none;appearance:none;
}
select{padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{margin-top:12px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;width:100%;padding:14px 16px;background:transparent;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;cursor:pointer;min-height:64px}
.row:last-child{border-bottom:0}
button.row:active{background:var(--surface-2)}
div.row{cursor:default}
.row-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-t{font:600 17px/1.3 var(--f-serif);overflow-wrap:anywhere}
.row-d{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--bx,var(--b0))}
.empty{color:var(--muted);padding:18px 4px}

/* session */
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font:600 15px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--muted)}
.prog{height:6px;border-radius:99px;background:var(--b0);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stage{margin-top:20px;perspective:1600px}
.card{position:relative;height:clamp(280px,46vh,460px);cursor:pointer}
.card-inner{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face,.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:24px 30px;display:flex;flex-direction:column;gap:12px}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.ftop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.label{font:600 12px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center}
.txt{font-family:var(--f-serif);overflow-wrap:anywhere;text-wrap:pretty}
.txt.is-term{font-weight:600}
.txt.xl{font-size:clamp(34px,6vw,56px);line-height:1.1;letter-spacing:-.015em}
.txt.lg{font-size:clamp(26px,4.4vw,38px);line-height:1.2}
.txt.md{font-size:clamp(20px,3.2vw,27px);line-height:1.35}
.txt.sm{font-size:18px;line-height:1.45}
.sact{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.sact .one{grid-column:1/-1}
.shint{text-align:center;margin-top:12px}
.qcard{margin-top:20px;min-height:180px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:640px){.opts,.sact{grid-template-columns:1fr}}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;min-height:64px;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;font:500 17px/1.35 var(--f-ui);cursor:pointer;overflow-wrap:anywhere}
.opt .k{font-weight:700;color:var(--muted);min-width:1.1em;font-variant-numeric:tabular-nums}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.fb{margin-top:14px;font-weight:600}
.fb.good{color:var(--good)}
.fb.bad{color:var(--bad)}

/* summary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-block:1px solid var(--line)}
.stat{padding:18px 4px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat+.stat{border-left:1px solid var(--line);padding-left:20px}
.stat .n{font:600 40px/1 var(--f-serif);font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:14px}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
.sheet{width:min(560px,100%);max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;margin-block:24px}}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.inline{flex-direction:row;align-items:center;gap:12px}
.inline select{width:auto;flex:1}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,480px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font:500 15px/1.35 var(--f-ui);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .card-inner{transform:none!important}
  .face.back{transform:none;visibility:hidden}
  .card.flipped .face.back{visibility:visible}
  .card.flipped .face.front{visibility:hidden}
}
</style>

<div id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

const SESSION_MAX = 25, MAX_CARDS = 1500, MAX_BYTES = 240000, MAX_RETRY = 3;
const INTERVALS = [0, 1, 3, 7, 14, 30];
const BOX_LABEL = ['New', 'Box 1', 'Box 2', 'Box 3', 'Box 4', 'Box 5'];
const BOX_SUB = ['Not seen yet', '1 day', '3 days', '1 week', '2 weeks', '1 month'];
const LS_KEY = 'termbox.decks.v1';

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2, 8);
const plural = (n, w) => n === 1 ? w : w + 's';
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function canon(v){
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v);
}
function blobSize(o){ try { return new Blob([JSON.stringify(o)]).size; } catch (e) { return JSON.stringify(o).length; } }
function dayStart(offset){ const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offset); return d.getTime(); }
const isDue = c => c.b === 0 || c.u <= Date.now();
function dueRel(u){ const n = Math.round((u - dayStart(0)) / 86400000); return n <= 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'; }
function sizeClass(t){ const n = String(t).length; return n <= 36 ? 'xl' : n <= 110 ? 'lg' : n <= 240 ? 'md' : 'sm'; }

/* ---------- state ---------- */
let mode = 'init';          // 'db' | 'local'
let col = null;
let decks = {};
let loaded = false;
let status = 'saved';
let V = {name: 'library'};
let S = null;               // study session
let SH = null;              // open sheet
let draft = {t: '', d: '', q: ''};
let lastKey = '';
let toastTimer = null;
const sync = {};
const deleting = new Set();
// Public deck catalog hosted beside index.html on GitHub Pages.
let sharedDecks = [];
let sharedCatalogState = 'loading';
let sharedCatalogMessage = '';
let sharedCatalogStarted = false;
let sharedBusyIndex = -1;

/* ---------- example deck (never saved) ---------- */
const example = {
  id: 'example', example: true, name: 'Cell biology', flip: 'term', created: 0, updated: 0,
  cards: [
    ['Mitochondrion', 'Organelle that makes most of the cell’s ATP through aerobic respiration.'],
    ['Ribosome', 'Molecular machine that builds proteins from amino acids, following mRNA instructions.'],
    ['Golgi apparatus', 'Stack of membranes that modifies, sorts and packages proteins for delivery.'],
    ['Endoplasmic reticulum', 'Membrane network where proteins are folded (rough) and lipids are made (smooth).'],
    ['Lysosome', 'Vesicle full of digestive enzymes that breaks down waste and worn-out parts.'],
    ['Osmosis', 'Movement of water across a semipermeable membrane toward the side with more dissolved solute.'],
    ['Diffusion', 'Net movement of particles from high to low concentration with no energy input.'],
    ['Chloroplast', 'Plant organelle where photosynthesis turns light into chemical energy.']
  ].map(r => ({i: rid() + rid(), t: r[0], d: r[1], b: 0, u: 0, s: 0, l: null}))
};

function allDecks(){ const l = Object.keys(decks).map(k => decks[k]); return l.length ? l : [example]; }
function getDeck(id){ if (id === 'example') return Object.keys(decks).length ? null : example; return decks[id] || null; }

/* ---------- data shape ---------- */
function toDoc(d){
  return {name: d.name, flip: d.flip, created: d.created, updated: d.updated,
    cards: d.cards.map(c => ({i: c.i, t: c.t, d: c.d, b: c.b, u: c.u, s: c.s, l: c.l}))};
}
function fromDoc(id, data){
  const cards = Array.isArray(data.cards) ? data.cards : [];
  return {
    id, name: typeof data.name === 'string' && data.name ? data.name : 'Untitled deck',
    flip: data.flip === 'def' ? 'def' : 'term', created: +data.created || 0, updated: +data.updated || 0,
    cards: cards.filter(c => c && typeof c.t === 'string').map(c => ({
      i: typeof c.i === 'string' && c.i ? c.i : rid() + rid(), t: c.t, d: typeof c.d === 'string' ? c.d : '',
      b: Math.min(5, Math.max(0, c.b | 0)), u: +c.u || 0, s: c.s | 0, l: c.l === 'm' || c.l === 'g' ? c.l : null
    })),

function counts(d){

  return {n, due, missed, total: d.cards.length};
}

/* ---------- storage ---------- */
function loadLocal(){
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return {};
    const o = JSON.parse(raw), out = {};
    Object.keys(o).forEach(id => { out[id] = fromDoc(id, o[id]); });
    return out;
  } catch (e) { return {}; }
}
function saveLocal(){
  try {
    const o = {}; Object.keys(decks).forEach(id => { o[id] = toDoc(decks[id]); });
    localStorage.setItem(LS_KEY, JSON.stringify(o)); setStatus('saved');
  } catch (e) { setStatus('error'); toast('Couldn’t save in this browser. Private windows can block saving.'); }
}

}
function queueSave(id, now){

async function flush(id){

  s.busy = false;

function flushAll(){ Object.keys(sync).forEach(id => { const s = sync[id]; if (s && (s.dirty || s.timer)) { clearTimeout(s.timer); s.timer = null; flush(id); } }); }
function persist(d, now){

async function removeDeck(id){

  deleting.add(id);
  const s = sync[id]; if (s) { clearTimeout(s.timer); s.timer = null; s.dirty = false; }

}
function onSnap(snap){
  const next = {}; let changed = false;
  snap.docs.forEach(ds => {
    const id = ds.id; if (deleting.has(id)) return;
    const loc = decks[id], st = sync[id];
    if (loc && st && (st.dirty || st.busy || st.timer)) { next[id] = loc; return; }
    const data = ds.data(); if (!data) return;
    const sig = canon(data);
    if (loc && loc._sig === sig) { next[id] = loc; return; }
    next[id] = fromDoc(id, data); changed = true;
  });
  Object.keys(decks).forEach(id => {
    if (id in next) return;
    const st = sync[id];
    if (st && (st.dirty || st.busy || st.timer)) next[id] = decks[id];

}

/* ---------- parsing ---------- */
const SEP = {tab: ['\t'], comma: [','], dash: [' — ', ' – ', ' - ', '—', '–'], colon: [':'], semi: [';'], pipe: ['|']};
const AUTO = ['\t', ' | ', ' — ', ' – ', ' - ', ' :: ', ': ', ';', ','];
function splitLine(line, sep){
  const list = sep === 'auto' ? AUTO : (SEP[sep] || AUTO);
  for (const s of list) {
    const i = line.indexOf(s);
    if (i > 0) { const t = line.slice(0, i).trim(), d = line.slice(i + s.length).trim(); if (t && d) return [t, d]; }
  }
  return null;
}
function parseTerms(text, sep){
  const cards = []; let skipped = 0;
  String(text || '').split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim();
    if (!line) return;
    const r = splitLine(line, sep);
    if (r) cards.push({t: r[0], d: r[1]}); else skipped++;
  });
  return {cards, skipped};
}
function addCards(d, list){
  const have = new Set(d.cards.map(c => c.t.trim().toLowerCase()));
  const fresh = []; let dupes = 0;
  list.forEach(r => {
    const k = r.t.toLowerCase();
    if (have.has(k)) { dupes++; return; }
    have.add(k); fresh.push({i: rid() + rid(), t: r.t, d: r.d, b: 0, u: 0, s: 0, l: null});
  });
  if (d.cards.length + fresh.length > MAX_CARDS) return {added: 0, dupes, error: 'A deck holds up to ' + MAX_CARDS + ' cards. Start a second deck for the rest.'};
  const before = d.cards; d.cards = before.concat(fresh);
  if (blobSize(toDoc(d)) > MAX_BYTES) { d.cards = before; return {added: 0, dupes, error: 'That would make the deck too large to save. Try a shorter list or split it into two decks.'}; }
  return {added: fresh.length, dupes};
}

/* ---------- study logic ---------- */
function buildQueue(d, pool, only){
  let cards = d.cards;
  if (only) { const set = new Set(only); cards = cards.filter(c => set.has(c.i)); }
  else if (pool === 'missed') cards = cards.filter(c => c.l === 'm');
  else if (pool === 'due') cards = cards.filter(isDue);
  let ordered;
  if (pool === 'all' && !only) ordered = shuffle(cards).sort((a, b) => a.b - b.b);
  else {
    const learn = cards.filter(c => c.b > 0).sort((a, b) => a.u - b.u);
    ordered = learn.concat(shuffle(cards.filter(c => c.b === 0)));
  }
  return shuffle(ordered.slice(0, SESSION_MAX)).map(c => c.i);
}
function makeOptions(d, c){
  const ans = d.flip === 'def' ? c.t : c.d;
  const seen = new Set([ans.trim().toLowerCase()]); const wrong = [];
  shuffle(d.cards.filter(x => x.i !== c.i)).forEach(x => {
    if (wrong.length >= 3) return;
    const t = d.flip === 'def' ? x.t : x.d, k = t.trim().toLowerCase();
    if (!t || seen.has(k)) return; seen.add(k); wrong.push({text: t, ok: false});
  });
  return shuffle([{text: ans, ok: true}].concat(wrong));
}
function startSession(id, m, pool, only){
  const d = getDeck(id); if (!d) return;
  const ids = buildQueue(d, pool, only);
  if (!ids.length) { toast('There are no cards to study here yet.'); return; }
  S = {deckId: id, mode: m, pool, queue: ids, pos: 0, flipped: false, revealed: false, graded: new Set(),
    got: 0, missed: new Set(), retries: {}, dueSet: new Set(d.cards.filter(isDue).map(c => c.i)), picked: null, opts: null, done: false};
  prepareCard(); render();
}
function curCard(){ const d = getDeck(S.deckId); return d ? (d.cards.find(c => c.i === S.queue[S.pos]) || null) : null; }
function prepareCard(){
  while (S.pos < S.queue.length && !curCard()) S.pos++;
  if (S.pos >= S.queue.length) { finish(); return; }
  S.flipped = false; S.revealed = false; S.picked = null;
  S.opts = S.mode === 'quiz' ? makeOptions(getDeck(S.deckId), curCard()) : null;
}
function grade(ok){
  const d = getDeck(S.deckId), c = curCard(); if (!d || !c) return;
  const id = c.i, first = !S.graded.has(id);
  c.s++;
  if (first) {
    S.graded.add(id);
    if (ok) {
      S.got++; c.l = 'g';
      if (S.dueSet.has(id)) { c.b = c.b === 0 ? 2 : Math.min(5, c.b + 1); c.u = dayStart(INTERVALS[c.b]); }
    } else {
      S.missed.add(id); c.l = 'm'; c.b = 1; c.u = dayStart(INTERVALS[1]);
    }
  }
  if (!ok) { S.retries[id] = (S.retries[id] || 0) + 1; if (S.retries[id] <= MAX_RETRY) S.queue.push(id); }
  persist(d);
}
function advance(){ S.pos++; prepareCard(); if (S) render(); }
function finish(){ S.done = true; const d = getDeck(S.deckId); if (d && !d.example && mode === 'db') { const s = sync[d.id]; if (s && (s.dirty || s.timer)) { clearTimeout(s.timer); s.timer = null; flush(d.id); } } }

async function loadSharedCatalog(force){

/* ---------- portable backup ---------- */
function exportBackup(){
  const data = {format: 'termbox-backup', version: 1, exportedAt: new Date().toISOString(), decks: {}};
  Object.keys(decks).forEach(id => { if (decks[id] && !decks[id].example) data.decks[id] = toDoc(decks[id]); });
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'termbox-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Backup downloaded. Save it in Dropbox to use it on another device.');
}
async function importBackup(file){
  if (!file) return;
  let parsed;
  try { parsed = JSON.parse(await file.text()); }
  catch (e) { toast('That file is not valid JSON.'); return; }
  // Be forgiving if a deck-only export is selected using the full-backup picker.
  if (parsed && parsed.format === 'termbox-deck') { await importDeck(file); return; }
  if (!parsed || parsed.format !== 'termbox-backup' || parsed.version !== 1 || !parsed.decks || typeof parsed.decks !== 'object' || Array.isArray(parsed.decks)) {
    toast('That file does not look like a Termbox backup. For a single deck, use Import deck.'); return;
  }
  const next = {};
  try {
    Object.keys(parsed.decks).forEach(id => {
      if (!id || id === 'example' || !parsed.decks[id] || typeof parsed.decks[id] !== 'object') throw new Error('bad deck');
      const d = fromDoc(id, parsed.decks[id]);
      if (d.cards.length > MAX_CARDS || blobSize(toDoc(d)) > MAX_BYTES) throw new Error('large deck');
      next[id] = d;
    });
  } catch (e) { toast('The backup contains a deck that could not be imported.'); return; }
  const count = Object.keys(next).length;
  if (!window.confirm('Import ' + count + ' deck' + (count === 1 ? '' : 's') + '? This replaces the decks currently saved in this browser/app, including study progress. Export a backup first if you want to keep the current version.')) return;
  const oldIds = Object.keys(decks);
  decks = next;
  if (mode === 'local') {
    saveLocal();
  } else {
    oldIds.filter(id => !(id in next)).forEach(id => { try { col.doc(id).delete().catch(() => {}); } catch (e) {} });
    Object.keys(next).forEach(id => queueSave(id, true));
  }
  S = null; V = {name: 'library'}; render();
  toast('Imported ' + count + ' deck' + (count === 1 ? '' : 's') + '.');
}

/* ---------- deck-only transfer ---------- */
function exportDeck(){
  const d = V.name === 'deck' ? getDeck(V.id) : null;
  if (!d || d.example) { toast('Open one of your own decks first.'); return; }
  const data = {format: 'termbox-deck', version: 1, exportedAt: new Date().toISOString(), deck: {
    id: d.id, name: d.name, flip: d.flip, created: d.created, updated: d.updated,
    cards: d.cards.map(c => ({i: c.i, t: c.t, d: c.d}))
  }};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'termbox-deck-' + d.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0,40) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Deck exported without study progress.');
}
async function importDeck(file){
  if (!file) return;
  let parsed;
  try { parsed = JSON.parse(await file.text()); }
  catch (e) { toast('That file is not valid JSON.'); return; }
  const src = parsed && parsed.deck;
  if (!parsed || parsed.format !== 'termbox-deck' || parsed.version !== 1 || !src || typeof src !== 'object' || Array.isArray(src) || typeof src.id !== 'string' || !src.id || src.id === 'example' || !Array.isArray(src.cards)) {
    toast('That file does not look like a Termbox deck file.'); return;
  }
  if (src.cards.length > MAX_CARDS) { toast('That deck has too many cards to import.'); return; }
  const incoming = [];
  const seen = new Set();
  for (const c of src.cards) {
    if (!c || typeof c.t !== 'string') { toast('The deck file contains an invalid card.'); return; }
    const i = typeof c.i === 'string' && c.i ? c.i : rid() + rid();
    if (seen.has(i)) { toast('The deck file contains duplicate card IDs.'); return; }
    seen.add(i); incoming.push({i, t: c.t, d: typeof c.d === 'string' ? c.d : ''});
  }
  const existing = decks[src.id];
  const preview = existing ? 'Merge ' + incoming.length + ' cards into “' + existing.name + '”? Matching cards will be updated, their study progress will be kept, and new cards will start fresh. Cards missing from the file will not be deleted.' :
    'Import “' + (typeof src.name === 'string' && src.name ? src.name : 'Untitled deck') + '” with ' + incoming.length + ' cards? Study progress is not included.';
  if (!window.confirm(preview)) return;
  let d, added = 0, updated = 0;
  if (existing) {
    d = fromDoc(existing.id, toDoc(existing));
    const byId = new Map(d.cards.map(c => [c.i, c]));
    incoming.forEach(c => {
      const old = byId.get(c.i);
      if (old) { if (old.t !== c.t || old.d !== c.d) updated++; old.t = c.t; old.d = c.d; }
      else { d.cards.push({i: c.i, t: c.t, d: c.d, b: 0, u: 0, s: 0, l: null}); added++; }
    });
    d.name = typeof src.name === 'string' && src.name.trim() ? src.name.trim() : d.name;
    d.flip = src.flip === 'def' ? 'def' : 'term';
  } else {
    d = {id: src.id, name: typeof src.name === 'string' && src.name.trim() ? src.name.trim() : 'Untitled deck', flip: src.flip === 'def' ? 'def' : 'term', created: +src.created || Date.now(), updated: Date.now(), cards: incoming.map(c => ({i:c.i,t:c.t,d:c.d,b:0,u:0,s:0,l:null}))};
    added = d.cards.length;
  }
  if (d.cards.length > MAX_CARDS || blobSize(toDoc(d)) > MAX_BYTES) {
    toast('This deck would exceed Termbox’s storage limit. No changes were saved.'); return;
  }
  decks[d.id] = d;
  persist(d, true); S = null; V = {name: 'deck', id: d.id}; draft = {t:'',d:'',q:''}; render();
  toast('Deck imported: ' + added + ' new, ' + updated + ' updated. Existing study progress was kept.');
}

  close: () => closeSheet(),

    const id = d.id; closeSheet(); removeDeck(id); go({name: 'library'}); toast('Deck deleted.');
  }
};
function flipCard(){

const FORM = {

  else if (t.id === 'st' || t.id === 'ss') updatePreview();
});
document.addEventListener('change', e => { if (e.target.id === 'ss') updatePreview(); else if (e.target.id === 'backup-file' && e.target.files && e.target.files[0]) importBackup(e.target.files[0]); else if (e.target.id === 'deck-file' && e.target.files && e.target.files[0]) importDeck(e.target.files[0]); });
document.addEventListener('keydown', e => {
  if (SH) { if (e.key === 'Escape') closeSheet(); return; }
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
    if (e.target.id === 'nt' && e.key === 'Enter') { e.preventDefault(); const nd = $('#nd'); if (nd) nd.focus(); }
    else if (e.target.id === 'nd' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const b = e.target.form && e.target.form.querySelector('[type=submit]'); if (b) b.click(); }
    return;
  }
  if (!S || S.done || tag === 'BUTTON') return;
  const k = e.key;
  if (S.mode === 'flip') {
    if (k === ' ' || k === 'Enter') { e.preventDefault(); flipCard(); }
    else if (S.revealed && (k === 'ArrowRight' || k === '2')) { e.preventDefault(); ACT.got(); }
    else if (S.revealed && (k === 'ArrowLeft' || k === '1')) { e.preventDefault(); ACT.missed(); }
  } else {
    if (/^[1-4]$/.test(k)) pick(+k - 1);
    else if ((k === ' ' || k === 'Enter') && S.picked != null) { e.preventDefault(); ACT.next(); }
  }
});
window.addEventListener('hashchange', () => { if ((location.hash || '#library').slice(1) !== hashFor(V)) route(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
window.addEventListener('pagehide', flushAll);

/* ---------- start ---------- */
async function init(){
  render();
  let dbNs = null, id = null;
  try {
    for (let i = 0; i < 20 && !(window.claude && window.claude.use); i++) await sleep(100);
    if (window.claude && window.claude.use) {
      const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      dbNs = r[0]; if (r[1]) id = await r[1].id();
    }
  } catch (e) { dbNs = null; }
  if (dbNs && id) {
    mode = 'db';
    try {
      col = dbNs.collection('data/users/' + id);
      col.onSnapshot(onSnap, err => {
        if (!loaded) { mode = 'local'; decks = loadLocal(); loaded = true; route(); }
        else toast('Lost connection to saved decks. Reload to reconnect.');
      });
    } catch (e) { mode = 'local'; decks = loadLocal(); loaded = true; route(); }
  } else { mode = 'local'; decks = loadLocal(); loaded = true; route(); }
  loadSharedCatalog();
}
init();
})();
</script>
